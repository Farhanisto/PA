[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pa"
version = "0.1.0"
description = "PA — personal AI assistant with LangGraph, Celery, FastAPI"
requires-python = ">=3.11"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "pydantic-settings",
  "python-dotenv",
  "httpx",
  "alembic",
  "langgraph",
  "langgraph-checkpoint-sqlite",
  "langchain-core",
  "langchain-openai",
  "celery[redis]",
  "redis",
  "sqlalchemy",
  "psycopg[binary]",
  "langgraph-checkpoint-postgres",
  # Pinned: 0.28 deprecates connected_accounts.initiate() for managed OAuth
  # and reshapes auth_configs.list(); a floating range silently breaks connect.
  "composio==0.28.0",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "httpx", "ruff", "mypy"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Alembic migrations must ship with the installed package.
pa = ["db/migrations/*.mako", "db/migrations/versions/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
