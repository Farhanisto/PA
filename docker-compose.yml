services:
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      APP_ENV: ${APP_ENV:-production}
      DATABASE_URL: sqlite:////data/pa.db
      LANGGRAPH_CHECKPOINT_DB: /data/pa_checkpoints.db
      REDIS_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      PA_FAKE_MODEL: ${PA_FAKE_MODEL:-1}
      NEBIUS_API_KEY: ${NEBIUS_API_KEY:-}
      NEBIUS_BASE_URL: ${NEBIUS_BASE_URL:-https://api.tokenfactory.nebius.com/v1/}
      NEBIUS_MODEL: ${NEBIUS_MODEL:-}
    volumes:
      - pa_data:/data
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 12

  worker:
    build: .
    command: celery -A pa.queue.celery_app:celery_app worker --loglevel=INFO --concurrency=1
    environment:
      APP_ENV: ${APP_ENV:-production}
      DATABASE_URL: sqlite:////data/pa.db
      LANGGRAPH_CHECKPOINT_DB: /data/pa_checkpoints.db
      REDIS_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      PA_FAKE_MODEL: ${PA_FAKE_MODEL:-1}
      NEBIUS_API_KEY: ${NEBIUS_API_KEY:-}
      NEBIUS_BASE_URL: ${NEBIUS_BASE_URL:-https://api.tokenfactory.nebius.com/v1/}
      NEBIUS_MODEL: ${NEBIUS_MODEL:-}
    volumes:
      - pa_data:/data
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_healthy

  ui:
    build: .
    command: python -m pa.frontend
    ports:
      - "127.0.0.1:7860:7860"
    environment:
      APP_ENV: ${APP_ENV:-production}
      PA_UI_HOST: 0.0.0.0
      PA_UI_PORT: 7860
      DATABASE_URL: sqlite:////data/pa.db
      LANGGRAPH_CHECKPOINT_DB: /data/pa_checkpoints.db
      REDIS_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      PA_FAKE_MODEL: ${PA_FAKE_MODEL:-1}
      NEBIUS_API_KEY: ${NEBIUS_API_KEY:-}
      NEBIUS_BASE_URL: ${NEBIUS_BASE_URL:-https://api.tokenfactory.nebius.com/v1/}
      NEBIUS_MODEL: ${NEBIUS_MODEL:-}
    volumes:
      - pa_data:/data
    depends_on:
      api:
        condition: service_healthy

volumes:
  redis_data:
  pa_data:
